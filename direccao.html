<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Direcção · Gescolar</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="gescolar.css">
<style>
.nav button.soon{opacity:.55;cursor:default}
.nav button.soon:hover{background:none}
.nav button.soon span:first-of-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav .em-breve{flex:none;margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.passo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.passo:last-child{border-bottom:0}
.passo .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;border:2px solid var(--line);color:var(--muted)}
.passo.feito .n{background:var(--ok);border-color:var(--ok);color:#fff}
.passo.agora .n{background:var(--sun);border-color:var(--sun);color:#2c2000}
.passo b{display:block;font-size:15.5px}
.passo small{color:var(--muted)}
.carregar{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 16px;color:var(--muted)}
.carregar .spinner{margin:0;width:28px;height:28px;border-width:3px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px}
.chk label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hg{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
.hg th{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 4px;text-align:center}
.hg td.t{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;padding-right:8px;width:96px}
.hg td.c{height:58px;border:1.5px dashed var(--line);border-radius:9px;cursor:pointer;vertical-align:top;padding:6px 8px;font-size:13px;line-height:1.25;background:var(--surface)}
.hg td.c:hover{border-color:var(--blue)}
.hg td.c.on{border-style:solid;border-left-width:5px}
.hg td.c b{display:block;font-size:13.5px;color:var(--ink)}
.hg td.c small{color:var(--muted);font-size:11.5px;display:block}
.hg td.c .mais{color:var(--muted);font-size:20px;display:grid;place-items:center;height:100%}
.tempo{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.tempo .inp{height:34px;font-family:var(--f-mono);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.carga{display:flex;flex-wrap:wrap;gap:6px}
.carga span{font-size:12.5px;border-radius:6px;padding:3px 8px;background:var(--surface2,#EEF2F8);border:1px solid var(--line)}
.carga span.ok{border-color:var(--ok);color:var(--ok)}
.carga span.falta{border-color:var(--warn);color:var(--warn)}
.com{padding:16px 18px;border-bottom:1px solid var(--line)}
.com:last-child{border-bottom:0}
.com h4{margin:0 0 4px;font-size:16px}
.com p{margin:8px 0 0;white-space:pre-wrap;color:var(--ink);font-size:14.5px;line-height:1.5}
textarea.inp{height:auto;min-height:130px;padding:10px;line-height:1.45;resize:vertical}
.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.mx th,.mx td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface)}
.mx thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;z-index:2}
.mx th.nm,.mx td.nm{text-align:left;position:sticky;left:0;z-index:1;border-right:1px solid var(--line);min-width:180px}
.mx thead th.nm{z-index:3}
.mx th.dc{cursor:pointer;border-top:4px solid transparent}
.mx th.dc:hover{color:var(--blue)}
.mx td.v{font:700 13.5px var(--f-mono)}
.mx .neg{color:var(--bad)} .mx .pos{color:var(--ok)}
.dcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.dc-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.dc-card:hover{border-color:var(--blue)}
.dc-card b{display:block;font-size:14.5px}
.dc-card small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media print{.side,.top,.ph .actions,.dcs,.no-print{display:none!important}.app{display:block}.main{margin:0}.page{padding:0}.card{box-shadow:none}}
.msg-err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="root"><div class="carregar"><div class="spinner"></div>A abrir o painel…</div></div>
<div class="toasts" id="toasts"></div>
<script src="pauta.js" charset="utf-8"></script>
<script>
(function(){
'use strict';
var PROXY = 'https://gescolar-proxy.onrender.com';

/* ---------- utilidades ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function grp(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function mt(n){ return grp(n)+' MT'; }
function data(iso){ if(!iso) return '—'; var d=new Date(iso); return isNaN(d)?'—':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function iniciais(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+((p.length>1?p[p.length-1]:'')[0]||'')).toUpperCase(); }
var CORES=['#0A64DC','#0E7C86','#7B4DD6','#C2410C','#168A52','#B4235A','#0B2A4A','#8A6D00'];
function av(n){ var h=0; for(var i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return '<span class="av" style="background:'+CORES[h%CORES.length]+'">'+esc(iniciais(n))+'</span>'; }
var IC={home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',layers:'M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5',book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15zM6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5',board:'M2 3h20M4 3v11h16V3M12 14v4M8 21l4-3 4 3',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',cal:'M8 2v4M16 2v4M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',grade:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 15l2 2 4-4',wallet:'M20 7H5a2 2 0 0 1 0-4h13v4M3 5v14a2 2 0 0 0 2 2h15V7M16 14h.01',receipt:'M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7-3-2-3 2-3-2-3 2-3-2zM8 8h8M8 12h8M8 16h5',mega:'M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 9a3 3 0 0 1 0 6M19 6a7 7 0 0 1 0 12',cog:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',plus:'M12 5v14M5 12h14',x:'M18 6 6 18M6 6l12 12',menu:'M3 6h18M3 12h18M3 18h18',save:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8',check:'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',sparkle:'M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z'};
IC.download='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3'; IC.image='M3 5h18v14H3zM8.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M21 15l-5-5L5 19';
function ic(n,x){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" '+(x||'')+'><path d="'+IC[n]+'"/></svg>'; }
function pl(n,a,b){ return n+' '+(n===1?a:b); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.innerHTML='<i></i><span>'+esc(m)+'</span>'; $('#toasts').appendChild(t); setTimeout(function(){ t.remove(); },3600); }

var NIVEL = { ESC:'Escolinha', PRI:'Ensino Primário', SEC:'Ensino Secundário', TEC:'Técnico-Profissional', SUP:'Ensino Superior', CON:'Escola de Condução' };
var TEM_MODELO = { ESC:1, PRI:1, SEC:1 };
var TERMO = { ESC:'área', SUP:'cadeira', TEC:'módulo', CON:'módulo' };

/* ---------- sessão ---------- */
var SES = null;
try{ SES = JSON.parse(localStorage.getItem('gs_sessao')||'null'); }catch(e){}
if(!SES || !SES.token){ location.replace('entrar.html'); return; }
function sair(){ try{ localStorage.removeItem('gs_sessao'); }catch(e){} location.replace('entrar.html'); }

function api(rota, corpo){
  return fetch(PROXY+rota, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token}, body:JSON.stringify(corpo||{}) })
    .then(function(r){ return r.json().catch(function(){ return {ok:false,erro:'Resposta inválida do servidor.'}; }).then(function(d){ if(r.status===401){ sair(); } return d; }); })
    .catch(function(){ return {ok:false, erro:'Sem ligação ao servidor. Verifique a internet e tente de novo.'}; });
}

/* ---------- estado ---------- */
var S = { pag:'painel', escola:null, nome:'', painel:null, turmas:null, disciplinas:null, professores:null, estudantes:null, filtroTurma:'' };
try{ var h=(location.hash||'').slice(1); if(h) S.pag=h; }catch(e){}

/* ---------- casca ---------- */
var NAV = [['Arranque'],['painel','Painel','home'],['turmas','Turmas e salas','layers'],['disciplinas','Disciplinas','book'],['professores','Professores','board'],['estudantes','Estudantes','users'],
  ['Financeiro'],['propinas','Propinas e multas','wallet'],['facturas','Facturas e recibos','receipt'],
  ['Escola'],['horarios','Horários','cal'],['pautas','Pautas e notas','grade'],['comunicados','Comunicados','mega']];
function casca(){
  var e=S.escola||{};
  $('#root').innerHTML='<div class="app"><aside class="side" id="side">'+
    '<div class="brand"><img src="logo.png" alt=""><div><b>G<i>e</i>scolar</b><small>gescolar.co.mz</small></div></div>'+
    '<div class="school"><strong>'+esc(e.nome||'')+'</strong><span>'+esc((e.subdominio||'')+'.gescolar.co.mz · '+(e.ano||''))+'</span></div>'+
    '<nav class="nav">'+NAV.map(function(n){ if(n.length===1) return '<div class="grp">'+n[0]+'</div>';
      if(n[3]) return '<button class="soon" type="button" tabindex="-1">'+ic(n[2])+'<span>'+n[1]+'</span><span class="em-breve">em breve</span></button>';
      return '<button type="button" class="'+(S.pag===n[0]?'on':'')+'" data-go="'+n[0]+'">'+ic(n[2])+'<span>'+n[1]+'</span></button>'; }).join('')+'</nav>'+
    '<div class="me">'+av(S.nome||'?')+'<div class="who"><strong>'+esc(S.nome)+'</strong><span>Direcção</span></div></div>'+
    '<a class="exit" href="#" id="sair">'+ic('out','width="14" height="14"')+'Sair</a></aside>'+
    '<div class="main"><header class="top"><button class="menu-btn" id="menu" aria-label="Menu">'+ic('menu','width="18" height="18"')+'</button>'+
    '<div class="top-title">'+ic('layers','width="16" height="16" style="color:var(--blue)"')+'Área da Direcção</div>'+
    (e.estado==='teste'?'<span class="pill info" style="margin-left:auto">Período de teste até '+esc(data(e.teste_ate))+'</span>':'')+
    '</header><main class="page" id="page"></main></div></div>';
  $('#sair').onclick=function(ev){ ev.preventDefault(); sair(); };
  $('#menu').onclick=function(ev){ ev.stopPropagation(); $('#side').classList.toggle('open'); };
  $$('[data-go]').forEach(function(b){ b.onclick=function(){ ir(b.getAttribute('data-go')); }; });
  pagina();
}
function ir(p){ S.pag=p; try{ history.replaceState(null,'','#'+p); }catch(e){} var sd=$('#side'); if(sd) sd.classList.remove('open'); casca(); window.scrollTo(0,0); }
function aCarregar(){ $('#page').innerHTML='<div class="carregar"><div class="spinner"></div>A carregar…</div>'; }
function ph(eb,t,sub,acc){ return '<div class="ph"><div><div class="eyebrow">'+eb+'</div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="actions">'+(acc||'')+'</div></div>'; }
function erroCaixa(m){ return '<div class="msg-err">'+esc(m)+'</div>'; }

/* ---------- modal ---------- */
function modal(html){ fechar(); var s=document.createElement('div'); s.className='scrim'; s.id='ov'; s.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>'; s.addEventListener('mousedown',function(e){ if(e.target===s) fechar(); }); document.body.appendChild(s); var f=s.querySelector('input,select'); if(f) setTimeout(function(){ f.focus(); },30); $$('[data-fechar]',s).forEach(function(b){ b.onclick=fechar; }); return s; }
function fechar(){ var o=$('#ov'); if(o) o.remove(); }
function aGravar(btn, sim){ if(sim){ btn.disabled=true; btn.dataset.txt=btn.innerHTML; btn.innerHTML='A gravar…'; } else { btn.disabled=false; if(btn.dataset.txt) btn.innerHTML=btn.dataset.txt; } }
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(window.__gsSujo && window.__gsSujo() && $('#pe')) return; fechar(); } });

/* ---------- páginas ---------- */
function pagina(){
  var f = { painel:pPainel, turmas:pTurmas, disciplinas:pDisciplinas, professores:pProfessores, estudantes:pEstudantes, propinas:pPropinas, facturas:pFacturas, horarios:pHorarios, pautas:pPautas, comunicados:pComunicados }[S.pag] || pPainel;
  f();
}

// PAINEL — arranque guiado
function pPainel(){
  aCarregar();
  api('/painel').then(function(d){
    if(!d.ok){ $('#page').innerHTML=erroCaixa(d.erro); return; }
    S.painel=d; S.escola=d.escola||S.escola;
    var c=d.contagem, passos=[
      ['turmas','Criar as turmas e salas','Cada turma tem o nível, o turno, a sala e a propina mensal.',c.turmas,'turma'],
      ['disciplinas','Criar as disciplinas','Pode carregar o currículo modelo de cada nível e ajustar depois.',c.disciplinas,'disciplina'],
      ['professores','Registar os professores','Com as disciplinas que cada um pode dar.',c.professores,'professor'],
      ['estudantes','Matricular os estudantes','Cada estudante recebe o número e fica ligado ao encarregado.',c.estudantes,'estudante']];
    var prox=-1; passos.forEach(function(p,i){ if(prox<0 && !p[3]) prox=i; });
    var falta=passos.filter(function(p){ return !p[3]; }).length;
    var primeiro=(S.nome||'').split(' ')[0];
    $('#page').innerHTML = ph('Painel da Direcção','Olá, '+esc(primeiro),'')+
      '<section class="resumo"><p class="frase">'+(falta?
        'A <mark>'+esc(S.escola.nome)+'</mark> está criada. Faltam <mark>'+falta+' '+(falta===1?'passo':'passos')+'</mark> para a escola começar a funcionar no Gescolar.' :
        'A <mark>'+esc(S.escola.nome)+'</mark> tem tudo o que precisa para começar: '+pl(c.turmas,'turma','turmas')+', '+pl(c.disciplinas,'disciplina','disciplinas')+', '+pl(c.professores,'professor','professores')+' e '+pl(c.estudantes,'estudante','estudantes')+'.')+'</p></section>'+
      '<div class="grid g4">'+[['Turmas',c.turmas],['Disciplinas',c.disciplinas],['Professores',c.professores],['Estudantes',c.estudantes]].map(function(k){ return '<div class="card kpi"><div class="l">'+k[0]+'</div><div class="v">'+grp(k[1])+'</div></div>'; }).join('')+'</div>'+
      '<section class="card">'+passos.map(function(p,i){ var st=p[3]?'feito':(i===prox?'agora':'');
        return '<div class="passo '+st+'"><span class="n">'+(p[3]?'✓':(i+1))+'</span><div><b>'+p[1]+'</b><small>'+(p[3]?p[3]+' '+(p[3]===1?p[4]:p[4]+'s')+' registad'+(p[4]==='disciplina'||p[4]==='turma'?'a':'o')+(p[3]===1?'':'s'):p[2])+'</small></div>'+
          '<button class="btn '+(i===prox?'pri':'')+' sm" data-go2="'+p[0]+'">'+(p[3]?'Ver':'Começar')+'</button></div>'; }).join('')+'</section>'+
      '<p class="small muted" style="margin:0">Depois do arranque, gere as mensalidades em <a class="link" href="#propinas" data-go2="propinas">Propinas e multas</a>. Horários e pautas vêm a seguir.</p>';
    $$('[data-go2]').forEach(function(b){ b.onclick=function(){ ir(b.getAttribute('data-go2')); }; });
  });
}

// TURMAS
function pTurmas(){
  aCarregar();
  Promise.all([api('/turmas'), api('/professores')]).then(function(r){
    var d=r[0]; if(!d.ok){ $('#page').innerHTML=erroCaixa(d.erro); return; }
    S.turmas=d.turmas; S.professores=r[1].ok?r[1].professores:[];
    var L=d.turmas;
    $('#page').innerHTML = ph('Arranque','Turmas e salas', L.length? L.length+' turmas activas.' : 'Ainda não há turmas. Crie a primeira.', '<button class="btn pri" id="nova">'+ic('plus')+'Nova turma</button>')+
      (L.length? '<section class="card"><div class="tbl-wrap"><table><thead><tr><th>Turma</th><th>Nível</th><th>Turno</th><th>Sala</th><th class="r">Estudantes</th><th class="r">Propina</th><th></th></tr></thead><tbody>'+
        L.map(function(t){ return '<tr><td><b>'+esc(t.nome)+'</b><div class="small muted mono">'+esc(t.codigo)+'</div></td><td><span class="tag">'+esc(NIVEL[t.nivel]||t.nivel)+'</span></td><td>'+esc(t.turno)+'</td><td>'+esc(t.sala||'—')+'</td><td class="r num">'+(t.estudantes||0)+' / '+(t.capacidade||0)+'</td><td class="r num">'+(t.propina?mt(t.propina):'—')+'</td>'+
          '<td class="r"><button class="btn sm" data-ed="'+t.id+'">Editar</button> <button class="btn sm danger" data-del="'+t.id+'">'+ic('trash')+'</button></td></tr>'; }).join('')+'</tbody></table></div></section>'
        : vazio('layers','Crie as turmas da escola','Por exemplo "10ª Classe A" ou "Sala dos 4 anos". Pode criar quantas precisar.'));
    $('#nova').onclick=function(){ formTurma(null); };
    $$('[data-ed]').forEach(function(b){ b.onclick=function(){ formTurma(L.filter(function(t){return t.id===b.getAttribute('data-ed');})[0]); }; });
    $$('[data-del]').forEach(function(b){ b.onclick=function(){ confirmar('Apagar esta turma?','Só é possível apagar turmas sem estudantes.', function(btn){ api('/turma-apagar',{id:b.getAttribute('data-del')}).then(function(x){ if(x.ok){ fechar(); toast('Turma apagada'); pTurmas(); } else { aGravar(btn,false); $('#cf-err').innerHTML=erroCaixa(x.erro); } }); }); }; });
  });
}
function vazio(i,t,s){ return '<section class="card card-b" style="text-align:center;padding:40px 20px"><div style="width:56px;height:56px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px">'+ic(i,'width="26" height="26"')+'</div><h3 style="font-size:18px">'+t+'</h3><p class="muted" style="margin:6px auto 0;max-width:46ch">'+s+'</p></section>'; }
function confirmar(tit,sub,fn){
  modal('<div class="modal-h"><h3>'+tit+'</h3></div><div class="modal-b"><p style="margin:0" class="muted">'+sub+'</p><div id="cf-err"></div></div><div class="modal-f"><button class="btn" data-fechar>Cancelar</button><button class="btn pri danger" id="cf-ok" style="background:var(--bad);border-color:var(--bad);color:#fff">Apagar</button></div>');
  $('#cf-ok').onclick=function(){ aGravar(this,true); fn(this); };
}
function opcoesNivel(sel){ var n=(S.escola&&S.escola.niveis&&S.escola.niveis.length)?S.escola.niveis:Object.keys(NIVEL); return n.map(function(k){ return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+NIVEL[k]+'</option>'; }).join(''); }
function formTurma(t){
  t=t||{};
  var profs=S.professores||[];
  modal('<div class="modal-h"><h3>'+(t.id?'Editar turma':'Nova turma')+'</h3><button class="icon-btn" data-fechar>'+ic('x')+'</button></div><div class="modal-b">'+
    '<div class="frow"><label class="field">Nome da turma<input class="inp" id="t-nome" value="'+esc(t.nome||'')+'" placeholder="Ex.: 10ª Classe A"></label><label class="field">Nível<select class="sel" id="t-nivel">'+opcoesNivel(t.nivel)+'</select></label></div>'+
    '<div class="frow"><label class="field">Classe ou ano<input class="inp" id="t-classe" value="'+esc(t.classe||'')+'" placeholder="Ex.: 10ª · Sala dos 4 anos · 2º Ano"></label><label class="field">Turno<select class="sel" id="t-turno">'+['Manhã','Tarde','Noite','Pós-laboral'].map(function(x){ return '<option'+(x===(t.turno||'Manhã')?' selected':'')+'>'+x+'</option>'; }).join('')+'</select></label></div>'+
    '<div class="frow"><label class="field">Sala<input class="inp" id="t-sala" value="'+esc(t.sala||'')+'" placeholder="Ex.: Bloco B · 21"></label><label class="field">Capacidade<input class="inp" id="t-cap" type="number" min="1" value="'+(t.capacidade||40)+'"></label></div>'+
    '<div class="frow"><label class="field">Propina mensal (MT)<input class="inp mono" id="t-prop" type="number" min="0" step="50" value="'+(t.propina||'')+'" placeholder="Ex.: 2500"></label>'+
    '<label class="field">Director(a) de turma<select class="sel" id="t-dir"><option value="">— escolher depois —</option>'+profs.map(function(p){ return '<option value="'+p.id+'"'+(p.id===t.director?' selected':'')+'>'+esc(p.nome)+'</option>'; }).join('')+'</select></label></div>'+
    (t.id?'':'<p class="small muted" style="margin:0">As disciplinas do mesmo nível que já existirem ficam ligadas à turma automaticamente.</p>')+
    '<div id="t-err"></div></div><div class="modal-f"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="t-ok">'+ic('save')+'Guardar</button></div>');
  $('#t-ok').onclick=function(){ var btn=this; aGravar(btn,true);
    api('/turma-guardar',{ id:t.id, nome:$('#t-nome').value, nivel:$('#t-nivel').value, classe:$('#t-classe').value, turno:$('#t-turno').value, sala:$('#t-sala').value, capacidade:$('#t-cap').value, propina:$('#t-prop').value, director:$('#t-dir').value||null, disciplinas: t.id? t.disciplinas : undefined })
      .then(function(x){ if(x.ok){ fechar(); toast(t.id?'Turma actualizada':'Turma criada'); pTurmas(); } else { aGravar(btn,false); $('#t-err').innerHTML=erroCaixa(x.erro); } }); };
}

// DISCIPLINAS
function pDisciplinas(){
  aCarregar();
  api('/disciplinas').then(function(d){
    if(!d.ok){ $('#page').innerHTML=erroCaixa(d.erro); return; }
    S.disciplinas=d.disciplinas;
    var niveis=(S.escola&&S.escola.niveis)||[], html=ph('Arranque','Disciplinas', 'Organizadas por nível. No secundário são disciplinas, no superior cadeiras, no técnico e na condução módulos, e na escolinha áreas.', '<button class="btn pri" id="nova">'+ic('plus')+'Nova disciplina</button>');
    niveis.forEach(function(nv){
      var L=d.disciplinas.filter(function(x){ return x.nivel===nv; });
      html+='<section class="card"><div class="card-h"><div><h3>'+NIVEL[nv]+'</h3><div class="sub">'+L.length+' '+(TERMO[nv]||'disciplina')+(L.length===1?'':'s')+'</div></div>'+
        (TEM_MODELO[nv]?'<button class="btn sm" data-modelo="'+nv+'">'+ic('sparkle')+'Carregar currículo modelo</button>':'')+'</div><div class="card-b">'+
        (L.length? '<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Sigla</th><th class="r">Tempos / semana</th>'+(nv==='SUP'?'<th class="r">Créditos</th>':'')+'<th>Avaliação</th><th></th></tr></thead><tbody>'+
          L.map(function(x){ return '<tr><td><span class="dot" style="background:'+esc(x.cor)+'"></span><b>'+esc(x.nome)+'</b></td><td class="mono small">'+esc(x.sigla)+'</td><td class="r num">'+x.carga+'</td>'+(nv==='SUP'?'<td class="r num">'+(x.creditos||'—')+'</td>':'')+'<td class="small">'+(x.descritiva?'A · EA · NA':'0 – 20')+'</td><td class="r"><button class="btn sm" data-ed="'+x.id+'">Editar</button> <button class="btn sm danger" data-del="'+x.id+'">'+ic('trash')+'</button></td></tr>'; }).join('')+'</tbody></table></div>'
          : '<p class="muted small" style="margin:0">Ainda sem '+(TERMO[nv]||'disciplina')+'s neste nível.'+(TEM_MODELO[nv]?' Use "Carregar currículo modelo" para começar em segundos.':'')+'</p>')+'</div></section>';
    });
    $('#page').innerHTML=html;
    $('#nova').onclick=function(){ formDisc(null); };
    $$('[data-ed]').forEach(function(b){ b.onclick=function(){ formDisc(d.disciplinas.filter(function(x){return x.id===b.getAttribute('data-ed');})[0]); }; });
    $$('[data-del]').forEach(function(b){ b.onclick=function(){ confirmar('Apagar esta disciplina?','Deixa de aparecer nas turmas e nos horários novos.', function(btn){ api('/disciplina-apagar',{id:b.getAttribute('data-del')}).then(function(x){ if(x.ok){ fechar(); toast('Disciplina apagada'); pDisciplinas(); } else { aGravar(btn,false); $('#cf-err').innerHTML=erroCaixa(x.erro); } }); }); }; });
    $$('[data-modelo]').forEach(function(b){ b.onclick=function(){ var nv=b.getAttribute('data-modelo'); b.disabled=true; b.textContent='A carregar…';
      api('/disciplinas-modelo',{nivel:nv}).then(function(x){ if(x.ok){ toast(x.criadas? x.criadas+' '+(TERMO[nv]||'disciplina')+'s criadas em '+NIVEL[nv] : 'Já tinha todas as disciplinas do modelo'); pDisciplinas(); } else { b.disabled=false; b.textContent='Carregar currículo modelo'; toast(x.erro); } }); }; });
  });
}

    S.professores=d.professores; S.disciplinas=r[1].ok?r[1].disciplinas:[];
    var mapa={}; S.disciplinas.forEach(function(x){ mapa[x.id]=x; });
    var L=d.professores;
    $('#page').innerHTML=ph('Arranque','Professores', L.length? L.length+' professores registados.' : 'Registe os professores. Mais tarde cada um recebe um convite para entrar no Gescolar.', '<button class="btn pri" id="novo">'+ic('plus')+'Novo professor</button>')+

        L.map(function(p){ return '<tr><td><div class="person">'+av(p.nome)+'<div><b>'+esc(p.nome)+'</b><small>'+(p.monodocencia?'Monodocência':'Desde '+(p.desde||'—'))+'</small></div></div></td><td>'+

    $('#novo').onclick=function(){ formProf(null); };

// ESTUDANTES
function pEstudantes(){
  aCarregar();
  Promise.all([api('/estudantes', S.filtroTurma?{turma:S.filtroTurma}:{}), api('/turmas')]).then(function(r){
    var d=r[0]; if(!d.ok){ $('#page').innerHTML=erroCaixa(d.erro); return; }
    S.turmas=r[1].ok?r[1].turmas:[]; var tm={}; S.turmas.forEach(function(t){ tm[t.id]=t; });
    var L=d.estudantes;
    $('#page').innerHTML=ph('Arranque','Estudantes', L.length? L.length+' estudantes'+(S.filtroTurma&&tm[S.filtroTurma]?' em '+esc(tm[S.filtroTurma].nome):' matriculados')+'.' : 'Matricule os estudantes. Cada um recebe um número e fica ligado ao encarregado.',
      '<select class="sel" id="e-f"><option value="">Todas as turmas</option>'+S.turmas.map(function(t){ return '<option value="'+t.id+'"'+(t.id===S.filtroTurma?' selected':'')+'>'+esc(t.nome)+'</option>'; }).join('')+'</select><button class="btn" id="fam">'+ic('users')+'Acesso das famílias</button><button class="btn pri" id="mat">'+ic('plus')+'Matricular</button>')+
      (L.length? '<section class="card"><div class="tbl-wrap"><table><thead><tr><th>Estudante</th><th>Turma</th><th>Encarregado</th><th>Nascimento</th></tr></thead><tbody>'+
        L.map(function(e){ return '<tr><td><div class="person">'+av(e.nome)+'<div><b>'+esc(e.nome)+'</b><small class="mono">'+esc(e.numero||'')+'</small></div></div></td><td>'+(tm[e.turma]?'<span class="tag">'+esc(tm[e.turma].nome)+'</span>':'—')+'</td><td class="small">'+(e.encarregado?esc(e.encarregado.nome)+'<div class="mono muted">'+esc(e.encarregado.telefone)+'</div>':'<span class="muted">—</span>')+'</td><td class="small num">'+data(e.nascimento)+'</td></tr>'; }).join('')+'</tbody></table></div></section>'
        : (S.turmas.length? vazio('users','Matricule o primeiro estudante','Precisa do nome, da turma e do contacto do encarregado.') : vazio('layers','Crie primeiro uma turma','Os estudantes são matriculados numa turma. Vá a "Turmas e salas".')));
    $('#e-f').onchange=function(){ S.filtroTurma=this.value; pEstudantes(); };
    $('#mat').onclick=function(){ if(!S.turmas.length){ toast('Crie primeiro uma turma'); ir('turmas'); return; } formMatricula(); };
    $('#fam').onclick=acessoFamilias;
  });
}

    '<div class="frow"><label class="field">Parentesco<select class="sel" id="m-par"><option>Mãe</option><option>Pai</option><option>Avó</option><option>Avô</option><option>Tia</option><option>Tio</option><option>Irmã</option><option>Irmão</option><option>Outro</option></select></label><label class="field">Email (opcional)<input class="inp" id="m-email" type="email"></label></div>'+
    '<p class="small muted" style="margin:0">Se o telemóvel já pertencer a um encarregado da escola, o estudante fica ligado a ele (irmãos na mesma família).</p>'+

    '<div id="m-err"></div></div><div class="modal-f"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="m-ok">'+ic('save')+'Matricular</button></div>');
  $('#m-ok').onclick=function(){ var btn=this; aGravar(btn,true);
    api('/matricular',{ nome:$('#m-nome').value, turma:$('#m-turma').value, sexo:$('#m-sexo').value, nascimento:$('#m-nasc').value, enc_nome:$('#m-enc').value, enc_telefone:$('#m-tel').value, enc_parentesco:$('#m-par').value, enc_email:$('#m-email').value, saude:$('#m-saude').value, telefone:$('#m-tel-est').value })
      .then(function(r){ if(r.ok){ fechar(); toast('Matriculado · Nº '+r.numero); S.filtroTurma=$('#m-turma')?$('#m-turma').value:S.filtroTurma; pEstudantes(); } else { aGravar(btn,false); $('#m-err').innerHTML=erroCaixa(r.erro); } }); };

function acessoFamilias(){
  modal('<div class="modal-h"><h3>Acesso das famílias</h3><button class="icon-btn" data-fechar>'+ic('x')+'</button></div><div class="modal-b" id="fa-b"><div class="carregar" style="padding:30px"><div class="spinner"></div>A carregar…</div></div>');
  api('/familias-link').then(function(r){
    var b=$('#fa-b'); if(!b) return;
    if(!r.ok){ b.innerHTML=erroCaixa(r.erro); return; }
    b.innerHTML='<p style="margin:0">Encarregados e estudantes entram no portal <b>sem palavra-passe</b>: escrevem o telemóvel (ou o número de estudante) e recebem um código por SMS. Lá vêem as propinas, pagam por M-Pesa, e-Mola ou cartão e descarregam os recibos.</p>'+
      '<label class="field">Link do portal da escola<div style="display:flex;gap:8px"><input class="inp mono" id="fa-l" readonly value="'+esc(r.link)+'" style="flex:1;min-width:0;font-size:13px"><button class="btn" id="fa-c">Copiar</button></div></label>'+
      '<p class="small muted" style="margin:0">Os <b>professores</b> entram no mesmo link, escolhem "Professor" e usam o telemóvel registado em Professores.</p>'+
      '<p class="small muted" style="margin:0">Código da escola: <b class="mono" style="color:var(--ink)">'+esc(r.codigo)+'</b> · '+r.com_telefone+' de '+r.encarregados+' encarregados com telemóvel registado.</p>'+
      '<div class="card card-b" style="background:var(--blue-soft);border-color:transparent"><b>Convidar por SMS</b><div class="small muted" style="margin:4px 0 10px">Envia um SMS a todos os encarregados com o link do portal. Pode ser enviado uma vez por hora.</div>'+
      '<button class="btn pri" id="fa-s"'+(r.com_telefone?'':' disabled')+'>Enviar convite a '+r.com_telefone+' encarregados</button><div id="fa-r" style="margin-top:10px"></div></div>';
    $('#fa-c').onclick=function(){ var i=$('#fa-l'); i.select(); try{ navigator.clipboard.writeText(r.link).then(function(){ toast('Link copiado'); },function(){ document.execCommand('copy'); toast('Link copiado'); }); }catch(e){ document.execCommand('copy'); toast('Link copiado'); } };
    $('#fa-s').onclick=function(){
      var btn=this; if(btn.dataset.conf!=='1'){ btn.dataset.conf='1'; btn.textContent='Confirmar: enviar '+r.com_telefone+' SMS'; btn.classList.add('sun'); btn.classList.remove('pri'); return; }
      aGravar(btn,true);
      api('/familias-convite').then(function(x){
        aGravar(btn,false);
        if(!x.ok){ $('#fa-r').innerHTML=erroCaixa(x.erro); return; }
        btn.disabled=true; btn.textContent='Convite enviado';
        $('#fa-r').innerHTML='<div class="small" style="color:var(--ok);font-weight:700">Enviado a '+x.enviados+' encarregados'+(x.falhas?' · '+x.falhas+' falharam':'')+'.</div>';
      });
    };
  });
}

/* reduz a imagem no browser: no máximo 360 px, para o logótipo ficar leve e sair sempre no PDF */
function lerLogo(ficheiro, fim){
  if(!ficheiro) return fim('Escolha uma imagem.');
  if(!/^image\/(png|jpeg|jpg|webp|gif|svg\+xml)$/i.test(ficheiro.type)) return fim('Use uma imagem PNG, JPG, WEBP ou SVG.');
  if(ficheiro.size > 8*1024*1024) return fim('A imagem tem mais de 8 MB. Escolha uma mais pequena.');
  var fr=new FileReader();
  fr.onerror=function(){ fim('Não foi possível ler a imagem.'); };
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){ fim('Esta imagem não abre. Tente outra.'); };
    img.onload=function(){
      var max=360, w=img.naturalWidth||img.width||max, h=img.naturalHeight||img.height||max, k=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
      var g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(img,0,0,c.width,c.height);
      var url=c.toDataURL('image/png');
      if(url.length>280000){ var g2=document.createElement('canvas'); g2.width=c.width; g2.height=c.height; var x=g2.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(c,0,0); url=g2.toDataURL('image/jpeg',0.86); }
      if(url.length>290000) return fim('O logótipo continua grande demais. Use uma imagem mais simples.');
      fim(null,url);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(ficheiro);
}

function minutos(h){ var p=String(h||'').split(':'); return (+p[0])*60+(+p[1]); }
function hhmm(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function gerarTempos(inicio, n, dur, pausa, recreioDepois, recreio){
  var t=[], m=minutos(inicio);
  for(var k=0;k<n;k++){ t.push({i:hhmm(m), f:hhmm(m+dur)}); m+=dur+(k+1===recreioDepois?recreio:pausa); }
  return t;

function triActual(){ var m=new Date().getMonth()+1; return m<=5?1:(m<=8?2:3); }
function pPautas(){
  if(typeof window.GSPauta==='undefined'){ $('#page').innerHTML=erroCaixa('Falta o ficheiro pauta.js no site (gescolar-web). Carregue-o no GitHub.'); return; }
  aCarregar();

    if(!r.ok){ $('#page').innerHTML=erroCaixa(r.erro); return; }
    S.turmas=r.turmas;
    if(!S.turmas.length){ $('#page').innerHTML=ph('Escola','Pautas e notas','')+vazio('layers','Crie primeiro uma turma','As pautas são por turma. Vá a "Turmas e salas".'); return; }
    S.P=S.P||{ turma:S.turmas[0].id, tri:triActual() };
    if(!S.turmas.some(function(t){ return t.id===S.P.turma; })) S.P.turma=S.turmas[0].id;

  });
}

}
function novoComunicado(){
  modal('<div class="modal-h"><h3>Novo comunicado</h3><button class="icon-btn" data-fechar>'+ic('x')+'</button></div><div class="modal-b">'+
    '<label class="field">Título<input class="inp" id="n-t" maxlength="120" placeholder="Ex.: Reunião de encarregados"></label>'+
    '<label class="field">Texto<textarea class="inp" id="n-x" maxlength="3000" placeholder="Escreva o aviso com a data, a hora e o local."></textarea><span class="small muted" id="n-c" style="font-weight:400">0 / 3000</span></label>'+
    '<label class="field">Para quem<select class="sel" id="n-d"><option value="">Toda a escola</option>'+(S.turmas||[]).map(function(t){ return '<option value="'+t.id+'">Só a turma '+esc(t.nome)+'</option>'; }).join('')+'</select></label>'+
    '<label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px;font-weight:600"><input type="checkbox" id="n-s" style="margin-top:3px"><span>Enviar também por SMS aos encarregados<br><span class="small muted" style="font-weight:400">Vai o título e o início do texto. Cada SMS tem custo.</span></span></label>'+
    '<div id="n-err"></div></div><div class="modal-f"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="n-ok">'+ic('mega')+'Publicar</button></div>');
  $('#n-x').oninput=function(){ $('#n-c').textContent=this.value.length+' / 3000'; };
  $('#n-ok').onclick=function(){
    var btn=this; aGravar(btn,true);
    api('/comunicado-guardar',{titulo:$('#n-t').value, texto:$('#n-x').value, turma:$('#n-d').value, sms:$('#n-s').checked}).then(function(r){
      if(!r.ok){ aGravar(btn,false); $('#n-err').innerHTML=erroCaixa(r.erro); return; }
      fechar(); toast(r.sms?'Publicado e enviado por SMS a '+r.sms+' encarregados':'Comunicado publicado'); if(r.aviso) setTimeout(function(){ toast(r.aviso); },400); pComunicados();
    });
  };
}

/* ---------- arranque ---------- */
fetch(PROXY+'/sessao',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token}})
  .then(function(r){ return r.json().then(function(d){ return {st:r.status,d:d}; }); })
  .then(function(x){
    var d=x.d;
    if(x.st===401 || !d.ok){ if(x.st===401) return sair(); $('#root').innerHTML='<div class="carregar">'+esc(d.erro||'Não foi possível abrir o painel.')+' <a class="link" href="entrar.html">Voltar a entrar</a></div>'; return; }
    if(d.pagina!=='direccao'){ location.replace((d.pagina||'entrar')+'.html'); return; }
    S.escola=d.escola; S.nome=d.nome;
    SES.token=d.token; try{ localStorage.setItem('gs_sessao', JSON.stringify({token:d.token,nome:d.nome,papel:d.papel,pagina:d.pagina,escola:d.escola,criada:Date.now()})); }catch(e){}
    casca();
  })
  .catch(function(){ $('#root').innerHTML='<div class="carregar">Sem ligação ao servidor do Gescolar. Na primeira vez do dia pode demorar alguns segundos. <a class="link" href="">Tentar de novo</a></div>'; });
document.addEventListener('click',function(e){ var sd=$('#side'); if(sd && !e.target.closest('#side') && !e.target.closest('#menu')) sd.classList.remove('open'); });
})();
</script>
