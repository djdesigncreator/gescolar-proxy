<style>html,body{margin:0;background:#F2F5FA}
#gs-reg{--blue:#0A64DC;--blue2:#0852B6;--blue-soft:#E6F0FD;--sun:#FFC20E;--marker:#FFD84D;--ink:#0E1B2E;--muted:#5A6A80;--line:#DCE4EF;--bg:#F2F5FA;--ok:#168A52;--bad:#CC3333;--bad-soft:#FCE6E6;
 font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding:28px 16px 60px;box-sizing:border-box;font-size:15px;line-height:1.45}
#gs-reg *{box-sizing:border-box}
#gs-reg .wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#gs-reg .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#gs-reg .brand{display:flex;align-items:center;gap:10px}
#gs-reg .brand img{width:42px;height:42px;border-radius:50%;background:#fff}
#gs-reg .brand b{font-family:Montserrat,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em}
#gs-reg .brand b i{font-style:normal;color:var(--sun)}
#gs-reg .brand small{display:block;font-size:11px;color:var(--muted)}
#gs-reg a.link{color:var(--blue);font-weight:600;text-decoration:none;font-size:14px}
#gs-reg h2{font-family:Montserrat,sans-serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em}
#gs-reg h2 mark{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 94%,transparent 94%);color:inherit}
#gs-reg p.sub{color:var(--muted);margin:6px 0 0}
#gs-reg .steps{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}
#gs-reg .steps span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
#gs-reg .steps span b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:11px;font-family:"JetBrains Mono",monospace;background:#fff}
#gs-reg .steps span.on{color:var(--ink)} #gs-reg .steps span.on b{background:var(--blue);border-color:var(--blue);color:#fff}
#gs-reg .steps span.done b{background:var(--ok);border-color:var(--ok);color:#fff}
#gs-reg .steps i{width:16px;height:1.5px;background:var(--line)}
#gs-reg .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
#gs-reg .lvc{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;font:inherit;color:inherit}
#gs-reg .lvc:hover{border-color:var(--blue)}
#gs-reg .lvc.on{border-color:var(--blue);background:var(--blue-soft)}
#gs-reg .lvc.on::after{content:"\2713";position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
#gs-reg .lvc b{font-family:Montserrat,sans-serif;font-size:16px}
#gs-reg .lvc .age{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--blue);font-weight:600}
#gs-reg .lvc small{color:var(--muted);font-size:13px}
#gs-reg .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
#gs-reg label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
#gs-reg .inp{font-weight:400;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:15px;color:var(--ink);background:#fff;width:100%}
#gs-reg .inp:focus{outline:2px solid var(--blue);outline-offset:-1px}
#gs-reg .mono{font-family:"JetBrains Mono",monospace}
#gs-reg .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#gs-reg .subd{display:flex}
#gs-reg .subd .inp{border-radius:8px 0 0 8px}
#gs-reg .subd span{display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;background:var(--bg);color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:13px;white-space:nowrap}
#gs-reg .hint{font-size:12.5px;font-weight:500}
#gs-reg .bar{display:flex;justify-content:space-between;gap:10px}
#gs-reg .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none}
#gs-reg .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
#gs-reg .btn.pri:hover{background:var(--blue2)}
#gs-reg .btn:disabled{opacity:.5;cursor:not-allowed}
#gs-reg .sum div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:8px 0;font-size:14px}
#gs-reg .sum span{color:var(--muted)} #gs-reg .sum b{text-align:right}
#gs-reg .msg{padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600}
#gs-reg .msg.bad{background:var(--bad-soft);color:var(--bad)}
#gs-reg .spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gsr .8s linear infinite}
@keyframes gsr{to{transform:rotate(360deg)}}
#gs-reg .done{text-align:center;align-items:center;padding-top:6vh}
#gs-reg .okc{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;margin:0 auto}
@media (max-width:620px){#gs-reg .row{grid-template-columns:1fr}#gs-reg h2{font-size:22px}}

#gs-reg .auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh;margin:-28px -16px -60px}
#gs-reg .art{background:#0B2A4A;color:#fff;padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
#gs-reg .art .brand b{color:#fff} #gs-reg .art .brand small{color:#8FA9C9}
#gs-reg .art h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:40px;line-height:1.08;margin:0;max-width:15ch}
#gs-reg .art h1 i{font-style:normal;color:#0B2A4A;background:linear-gradient(transparent 14%,#FFC20E 14%,#FFC20E 90%,transparent 90%);padding:0 .12em}
#gs-reg .art p{color:#D9E6F7;max-width:46ch;font-size:16px;margin:12px 0 0}
#gs-reg .lv{display:flex;flex-wrap:wrap;gap:8px} #gs-reg .lv span{border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-size:13px;color:#D9E6F7}
#gs-reg .form{padding:40px 44px;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:480px;width:100%;margin:0 auto}
#gs-reg .row2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:860px){#gs-reg .auth{grid-template-columns:1fr}#gs-reg .art{padding:28px 20px}#gs-reg .art h1{font-size:30px}#gs-reg .form{padding:28px 16px}}
</style>
</head>

  function $(s){ return document.querySelector('#gs-reg '+s); }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function sessao(){ try{ return JSON.parse(localStorage.getItem('gs_sessao')||'null'); }catch(e){ return null; } }
  function guardar(d){ try{ localStorage.setItem('gs_sessao', JSON.stringify({ token:d.token, nome:d.nome, papel:d.papel, pagina:d.pagina, escola:d.escola, criada:Date.now() })); }catch(e){} }

  document.getElementById('gs-reg').innerHTML =

   '<div><h1>A escola inteira <i>num só lugar.</i></h1><p>Notas, horários, propinas, multas e facturas — da escolinha à universidade, e também escolas de condução. Pagamentos por M-Pesa, e-Mola, Visa e Mastercard.</p></div>'+

   '<label class="f">Email<input class="inp" id="e" type="email" autocomplete="username" placeholder="nome@escola.co.mz"></label>'+
   '<label class="f">Palavra-passe<input class="inp" id="p" type="password" autocomplete="current-password"></label>'+
   '<button class="btn pri" id="b" type="submit">Entrar</button>'+
   '<div class="row2"><a class="link" href="recuperar.html">Esqueci a palavra-passe</a><a class="link" href="registo.html">Registar a minha escola \u2192</a></div>'+
   '<div style="margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--blue-soft);font-size:14px;line-height:1.45">\u00c9 encarregado de educa\u00e7\u00e3o ou estudante? N\u00e3o precisa de palavra-passe.<br><a class="link" href="acesso.html">Entrar com o meu telem\u00f3vel \u2192</a></div></form></div>';

  $('#f').onsubmit=function(ev){

    var email=$('#e').value.trim(), pass=$('#p').value, b=$('#b');

     })
     .catch(function(){ b.disabled=false; b.textContent='Entrar'; $('#aviso').innerHTML='<div class="msg bad">Sem ligação ao servidor. Verifique a internet e tente de novo.</div>'; });
